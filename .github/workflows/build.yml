# Reusable build-and-test workflow, called by ci.yml (every push and pull
# request) and release.yml (version tags), so a release ships exactly what
# CI built and tested - there is one definition of "the build", not two.
#
# Per architecture, on a runner OF that architecture: runs the ctest suite
# and the CLI wrap / DLL unwrap round trip natively (scripts/Build-Test-Verify.ps1
# builds for the runner's own architecture and checks the machine type, so
# the ARM64 leg really runs ARM64 code), then builds the distributable
# binaries (scripts/Build-Dist.ps1) and uploads them UNSIGNED as
# "unsigned-win-x64" / "unsigned-win-arm64". Holds no signing access at all;
# signing happens only in release.yml's sign job.
#
# The ARM64 leg runs on the "windows-11-arm" hosted runner label. That
# label's availability depends on your plan/repo visibility - verify it's
# available (Settings > Actions > Runners, or just watch the first run) and
# swap in a self-hosted ARM64 runner's label here if not.
name: Build

on:
  workflow_call:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs; see release.yml.

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one architecture shouldn't hide results from the other
      matrix:
        include:
          - arch: x64
            dist: win-x64
            runner: windows-2022
          - arch: ARM64
            dist: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # The hardening flags (/sdl, /Qspectre, CFG, and on x64 /CETCOMPAT and
      # /guard:ehcont) come from CMakeLists.txt's hkdfguard_apply_hardening,
      # so every build below gets them with no workflow-specific flags. This
      # variable makes CMake refuse to configure if the Spectre-mitigated
      # runtime libraries are missing, instead of only warning - a release
      # must never ship with the unmitigated static runtime. The step
      # "Ensure Spectre-mitigated runtime libraries" installs them first.
      HKDFGUARD_REQUIRE_SPECTRE_LIBS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # nothing later in this job pushes

      - name: Report elevation status
        shell: powershell
        # Machine-wide KEK *creation* (NCRYPT_MACHINE_KEY_FLAG) requires an
        # elevated process token, regardless of which NCrypt provider ends
        # up serving it (see kek_store.cpp) - this is the one real
        # precondition for the test step to pass on a hosted runner (a
        # missing TPM is NOT a precondition: kek_store.cpp already falls
        # back to the Software Key Storage Provider automatically, and every
        # test asserts on that provider generically rather than requiring
        # TPM specifically). Surfaced as its own early, clearly labeled
        # step - via ::warning:: rather than a silent skip - so a
        # non-elevated runner shows up as an obvious annotation in the
        # Actions UI, not just a wall of failed checks further down.
        run: |
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object System.Security.Principal.WindowsPrincipal($identity)
          $isAdmin = $principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Running as: $($identity.Name)"
          Write-Host "Process architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Elevated (Administrator token): $isAdmin"
          if (-not $isAdmin) {
            Write-Host "::warning::This job's process token is not elevated - machine-wide KEK creation will fail, and Build-Test-Verify.ps1 will fail loudly because of it, not because of anything wrong with the code."
          }

      # /Qspectre only covers this project's own code; the statically linked
      # C/C++ runtime is mitigated only if the Spectre-mitigated runtime
      # libraries are linked (CMake picks them up from the toolset's
      # lib\spectre\<arch> directory). Hosted runner images don't promise
      # them, so this checks the toolset the build scripts will use - the
      # newest Visual Studio with this runner's C++ tools, as both
      # Build-Test-Verify.ps1 and Build-Dist.ps1 select it - and installs
      # both architectures' libraries if either is missing.
      - name: Ensure Spectre-mitigated runtime libraries
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir "vswhere.exe"
          $setup = Join-Path $installerDir "setup.exe"
          $components = @(
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre")

          $toolComponent = if ("${{ matrix.arch }}" -eq "ARM64") {
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64" } else {
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" }
          $installs = @(& $vswhere -latest -products * -requires $toolComponent -property installationPath) |
            Where-Object { $_ }
          if (-not $installs) { throw "no Visual Studio installation with the C++ build tools was found" }

          function Get-MissingSpectreLibs([string]$vs) {
            $version = (Get-Content (Join-Path $vs "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt")).Trim()
            $lib = Join-Path $vs "VC\Tools\MSVC\$version\lib\spectre"
            return @("x64", "arm64" | Where-Object { -not (Test-Path (Join-Path $lib "$_\libcmt.lib")) } |
              ForEach-Object { "$version $_" })
          }

          foreach ($vs in $installs) {
            $missing = Get-MissingSpectreLibs $vs
            if ($missing.Count -eq 0) {
              Write-Host "Spectre-mitigated runtime present (x64, arm64) in $vs"
              continue
            }
            Write-Host "Missing in ${vs}: $($missing -join ', ') - installing $($components -join ', ')"
            $installerArgs = @("modify", "--installPath", "`"$vs`"", "--quiet", "--norestart", "--nocache")
            foreach ($c in $components) { $installerArgs += @("--add", $c) }
            $proc = Start-Process -FilePath $setup -ArgumentList $installerArgs -Wait -PassThru
            # 3010 = success, reboot recommended; the libraries are usable now.
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Visual Studio Installer exited with $($proc.ExitCode)"
            }
            $missing = Get-MissingSpectreLibs $vs
            if ($missing.Count -ne 0) { throw "still missing after install: $($missing -join ', ')" }
            Write-Host "Installed the Spectre-mitigated runtime (x64, arm64) into $vs"
          }

      - name: Build, test, and verify CLI wrap / DLL unwrap round trip (Release, ${{ matrix.arch }}, native)
        shell: powershell
        run: .\scripts\Build-Test-Verify.ps1 -Configuration Release

      # Unsigned here on purpose: signing happens once, in release.yml's
      # sign job, so build jobs never hold signing access and the ARM64
      # runner never has to run the x64 signing plugin under emulation.
      - name: Build the distributable artifacts (${{ matrix.arch }}, unsigned)
        shell: powershell
        run: .\scripts\Build-Dist.ps1 -Arch ${{ matrix.arch }}

      - name: Upload the unsigned binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.dist }}
          path: dist/${{ matrix.dist }}/
          if-no-files-found: error
          retention-days: 3

      # ci.yml's install-test job runs this against the MSI-installed DLL on
      # clean windows-2022 / windows-2025 runners. It comes from the same
      # Release build as the binaries above, so it tests exactly what ships.
      # x64 only: the hosted Windows Server runners are x64.
      - name: Upload the roundtrip test executable (x64)
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-win-x64
          path: build-release-x64/tests/test_roundtrip.exe
          if-no-files-found: error
          retention-days: 3

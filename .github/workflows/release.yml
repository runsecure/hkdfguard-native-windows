# Builds hkdfguard-native-windows's Release artifacts for both x64 and ARM64,
# validates each natively (ctest suite + CLI wrap / DLL unwrap round trip via
# scripts/Build-Test-Verify.ps1, run ON that architecture, not
# cross-compiled and merely hoped to work), signs everything through Azure
# Artifact Signing, then publishes one versioned GitHub Release - so other
# repositories (e.g. a C# wrapper) can pull a stable, versioned download URL
# instead of an ephemeral workflow artifact.
#
# Triggered by pushing a version tag (vX.Y.Z). Reuses this repo's own
# scripts/ rather than duplicating their logic here. Three jobs:
#
#   build    build.yml, the same reusable workflow ci.yml runs: per
#            architecture, build, test, stage the UNSIGNED binaries.
#            Holds no signing access at all.
#   sign     one x64 job, in the "release" environment: signs all four
#            binaries with scripts/ArtifactSigning.ps1 (the same code as a
#            local `scripts\build-dist-signed.bat`), builds and signs both
#            MSIs, zips, and attests provenance of the signed files.
#   publish  creates the GitHub Release from the sign job's output.
#
# Before tagging: run the suite on a machine with a TPM (see README.md,
# "TPM tests are the developer's and maintainer's responsibility") - this
# workflow's runners have none, so it cannot cover the TPM-only checks.
# To cut a release: git tag v0.9.0; git push origin v0.9.0
# Any v0.x.y tag is published as a GitHub pre-release (pre-release testing);
# v1.0.0 and later as normal releases. The version must increase with every
# release, or the MSI upgrade won't replace the installed one.
#
# Signing setup this workflow depends on (Azure and GitHub, not code):
#   - Repository secrets AZURE_CLIENT_ID (the Entra app GitHub signs in as),
#     AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID.
#   - That app holds "Artifact Signing Certificate Profile Signer" on the
#     signing account named in scripts/signing/metadata.json.
#   - The app has a federated credential trusting this repository's
#     "release" environment. The sign job runs in that environment, so the
#     OIDC subject GitHub presents is
#       repo:<owner>/hkdfguard-native-windows:environment:release
#     (in this repository's ID-qualified form). A credential for a branch or
#     tag does not match a job that runs in an environment.
#   - Recommended: restrict the "release" environment (Settings >
#     Environments) to tags matching v*, so only a release can sign.
#
# See build.yml for the ARM64 runner-label caveat.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default; each job asks for exactly what it needs below.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not tags: a tag can be
# moved to different code after the fact, a commit SHA cannot. The trailing
# comment names the release each SHA corresponds to. To update one, look up
# the new tag's commit (git ls-remote https://github.com/<action> refs/tags/<tag>;
# for an annotated tag use the ^{} line) and replace both.

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Build and test both architectures natively; uploads unsigned-win-x64
  # and unsigned-win-arm64. The same workflow ci.yml runs on every push.
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  sign:
    needs: build
    runs-on: windows-2022
    # Signing a handful of files takes minutes; a hang should fail the run
    # long before GitHub's 6-hour job limit.
    timeout-minutes: 60
    # The Entra app's federated credential trusts this environment (see the
    # header). Restrict the environment to v* tags in the repository settings.
    environment: release
    permissions:
      contents: read
      id-token: write     # Azure sign-in (OIDC) and build provenance attestation
      attestations: write # build provenance attestation (storage)
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the unsigned x64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-win-x64
          path: dist/win-x64

      - name: Download the unsigned ARM64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-win-arm64
          path: dist/win-arm64

      # The MSI ProductVersion is the tag without its "v"; it must fit MSI's
      # major.minor.build limits, and equal the project() VERSION in
      # CMakeLists.txt, which the binaries' version resources carry.
      - name: Determine the release version
        id: version
        shell: powershell
        # Untrusted values reach scripts through the environment, never by expression substitution into
        # the script text, where a crafted tag name would become PowerShell code.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v(\d{1,3})\.(\d{1,3})\.(\d{1,5})$' -or
              [int]$Matches[1] -gt 255 -or [int]$Matches[2] -gt 255 -or [int]$Matches[3] -gt 65535) {
            throw "Tag '$tag' is not vMAJOR.MINOR.BUILD within MSI limits (major, minor <= 255; build <= 65535)."
          }
          $version = $tag.Substring(1)
          if ((Get-Content -Raw CMakeLists.txt) -notmatch 'project\(hkdfguard-native-windows\s+VERSION\s+(\d+\.\d+\.\d+)' -or $Matches[1] -ne $version) {
            throw "Tag '$tag' does not match the project() VERSION in CMakeLists.txt; bump that version and tag the commit that carries it."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Federated (OIDC) sign-in: GitHub's short-lived token is exchanged for
      # an Azure token for AZURE_CLIENT_ID - no stored Azure secret. Leaves
      # the Azure CLI signed in, which the signing plugin uses.
      - name: Sign in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The signtool plugin for Artifact Signing (Azure.CodeSigning.Dlib.dll),
      # taken from Microsoft's NuGet package rather than the client tools
      # MSI: the MSI copies the same files and then hung in InstallFinalize on
      # hosted runners. signtool itself comes from the runner's Windows SDK.
      #
      # Pinned by version and by the package's SHA-256, and the plugin must
      # carry a valid Microsoft Authenticode signature. To move to a newer
      # version, update both and check the new package's plugin the same way.
      - name: Get the Artifact Signing plugin
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          # Windows PowerShell's progress display makes Invoke-WebRequest
          # many times slower on larger downloads.
          $ProgressPreference = "SilentlyContinue"
          $version = "1.0.146"
          $sha256 = "7761E5D8F31E54B764DA21D33CD8B0A2940E1B05526C7DFCB5E94B0431426F70"
          $pkg = Join-Path $env:RUNNER_TEMP "microsoft.artifactsigning.client.$version.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ArtifactSigningClient"
          function Step([string]$what) { Write-Host ("[{0:HH:mm:ss}] {1}" -f (Get-Date), $what) }
          Step "Downloading Microsoft.ArtifactSigning.Client $version"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 300 -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" -OutFile $pkg
          $actual = (Get-FileHash -Path $pkg -Algorithm SHA256).Hash
          if ($actual -ne $sha256) {
            throw "Microsoft.ArtifactSigning.Client $version has SHA-256 $actual, not the pinned $sha256."
          }
          Step "Package matches the pinned SHA-256; extracting"
          Expand-Archive -Path $pkg -DestinationPath $dir -Force
          $dlib = Join-Path $dir "bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "bin\x64\Azure.CodeSigning.Dlib.dll is missing from the package" }
          $sig = Get-AuthenticodeSignature -FilePath $dlib
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "The Artifact Signing plugin is not validly signed by Microsoft ($($sig.Status): $($sig.SignerCertificate.Subject))."
          }
          Step "Artifact Signing plugin: $dlib"
          "HKDFGUARD_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Same helper and metadata (scripts/signing/metadata.json) as local
      # signing. Fails unless every file ends up validly signed AND
      # timestamped - there is no unsigned fallback for a release.
      - name: Sign the binaries (x64 and ARM64)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . .\scripts\ArtifactSigning.ps1
          $config = Initialize-ArtifactSigning
          Invoke-ArtifactSigning -Config $config -Files @(
            "dist\win-x64\HkdfGuard.dll",
            "dist\win-x64\hkdfguard.exe",
            "dist\win-arm64\HkdfGuard.dll",
            "dist\win-arm64\hkdfguard.exe")

      # Packages the signed binaries (already signed, so not re-signed), then
      # signs each MSI and checks its contents.
      - name: Build and sign the MSI installers
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($arch in "x64", "ARM64") {
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Msi.ps1 `
              -Arch $arch -Version $env:VERSION -SkipBuild -Sign
            if ($LASTEXITCODE -ne 0) { throw "Build-Msi.ps1 -Arch $arch failed (exit $LASTEXITCODE)" }
          }

      - name: Package the release assets
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:TAG
          $version = $env:VERSION
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          foreach ($dist in "win-x64", "win-arm64") {
            Compress-Archive -Path "dist\$dist\*" -DestinationPath "release-assets\hkdfguard-native-windows-$tag-$dist.zip" -Force
            Copy-Item "dist\hkdfguard-native-windows-$version-$dist.msi" release-assets\
          }
          foreach ($file in Get-ChildItem release-assets -File) {
            (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower() |
              Out-File -Encoding ascii "$($file.FullName).sha256"
          }
          Get-ChildItem release-assets -File | ForEach-Object { Write-Host "  $($_.Name)" }

      # Signed, verifiable statement that these exact files (by SHA-256) were
      # built by this workflow, from this commit, in this repository - made
      # after signing, so it covers the files that ship. The .sha256
      # sidecars alone prove nothing about origin. Verify a download with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      # Attestations need a public repository, or GitHub Enterprise Cloud
      # for a private one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.msi
            dist/win-x64/HkdfGuard.dll
            dist/win-x64/hkdfguard.exe
            dist/win-arm64/HkdfGuard.dll
            dist/win-arm64/hkdfguard.exe

      - name: Upload the signed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: windows-2022 # only needs the `gh` CLI (preinstalled), not the build toolchain
    permissions:
      contents: write # required for the "Create GitHub Release" step below
    steps:
      - name: Download the signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $files = Get-ChildItem -Path release-assets -File | Select-Object -ExpandProperty FullName
          Write-Host "Release assets:"
          $files | ForEach-Object { Write-Host "  $_" }
          # A 0.x version is pre-release testing: published as a GitHub
          # pre-release, so it is never shown as "Latest" or picked up as
          # the stable download. 1.0.0 and later publish as normal releases.
          $extra = @()
          if ($env:TAG -like "v0.*") {
            $extra += "--prerelease"
            Write-Host "Publishing as a pre-release (0.x version)"
          }
          gh release create $env:TAG $files --title $env:TAG --generate-notes @extra --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
